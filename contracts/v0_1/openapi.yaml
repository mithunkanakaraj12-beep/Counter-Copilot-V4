          type: 'null'
        evidence:
          contains:
            properties:
              role:
                const: supports
            required:
            - role
          items:
            $ref: '#/components/schemas/Evidence'
          maxItems: 20
          minItems: 1
          title: Evidence
          type: array
        proposal:
          anyOf:
          - $ref: '#/components/schemas/DimensionsProposalRecord'
