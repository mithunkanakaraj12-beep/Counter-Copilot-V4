components:
  securitySchemes:
    employeeSession:
      type: apiKey
      in: cookie
      name: cc_session
      description: Proposed (U-01). Secure, HttpOnly, SameSite cookie.
    integrationToken:
      type: http
      scheme: bearer
      description: Proposed (U-02). Bound to one yard, integration and channel.
  schemas:
    AcknowledgedWarning:
      additionalProperties: false
      description: The warning exactly as the approver saw it.
      properties:
        warning_id:
          maxLength: 500
          minLength: 1
          title: Warning Id
          type: string
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
          maxLength: 500
          minLength: 1
          title: Message
          type: string
        target:
          $ref: '#/components/schemas/Target'
        marked_false_positive:
          title: Marked False Positive
          type: boolean
      required:
      - warning_id
      - code
      - message
      - target
      - marked_false_positive
      title: AcknowledgedWarning
      type: object
    Actor:
      additionalProperties: false
      properties:
        type:
          enum:
          - system
          - employee
          - integration
          title: Type
          type: string
        person:
          anyOf:
          - $ref: '#/components/schemas/PersonRef'
          - type: 'null'
      required:
      - type
      - person
      title: Actor
      type: object
    AddLine:
      additionalProperties: false
      properties:
        op:
          const: add_line
          title: Op
          type: string
        line:
          $ref: '#/components/schemas/NewLine'
        source_spans:
          items:
            $ref: '#/components/schemas/SourceSpan'
          maxItems: 20
          title: Source Spans
          type: array
      required:
      - op
      - line
      - source_spans
      title: AddLine
      type: object
    AmbiguityReason:
      enum:
      - conflicting_statements
      - multiple_interpretations
      - range_given
      - unrecognized_term
      - unclear_reference
      - unreadable
      - negated
      - approximate
      - relative_quantity
      - number_word
      - separate_measurements
      - quoted_history_only
      - unsupported_by_source
      - inexact_normalization
      title: AmbiguityReason
      type: string
    ApprovalBlocker:
      additionalProperties: false
      description: One blocker per underlying issue.
      properties:
        blocker_id:
          maxLength: 500
          minLength: 1
          title: Blocker Id
          type: string
        code:
          $ref: '#/components/schemas/BlockerCode'
        message:
          maxLength: 500
          minLength: 1
          title: Message
          type: string
        target:
          $ref: '#/components/schemas/Target'
        warning_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warning Id
      required:
      - blocker_id
      - code
      - message
      - target
      - warning_id
      title: ApprovalBlocker
      type: object
    ApprovalCatalogCheck:
      additionalProperties: false
      description: The immutable record of what approval was checked against. Never recomputed.
      properties:
        catalog_version:
          description: Catalog version read at approval.
          maxLength: 500
          minLength: 1
          title: Catalog Version
          type: string
        matcher_version:
          description: Version of the comparison rules used.
          maxLength: 500
          minLength: 1
          title: Matcher Version
          type: string
        lines:
          items:
            $ref: '#/components/schemas/ApprovedLineCheck'
          maxItems: 500
          minItems: 1
          title: Lines
          type: array
      required:
      - catalog_version
      - matcher_version
      - lines
      title: ApprovalCatalogCheck
      type: object
    ApprovalRecord:
      additionalProperties: false
      description: Internal approval of one reviewed version. It authorizes nothing external.
      properties:
        approval_id:
          format: uuid
          title: Approval Id
          type: string
        request_id:
          format: uuid
          title: Request Id
          type: string
        approved_version:
          description: The version that was reviewed. Approval creates approved_version + 1.
          minimum: 1
          title: Approved Version
          type: integer
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Content Sha256
          type: string
        catalog_check:
          $ref: '#/components/schemas/ApprovalCatalogCheck'
        catalog_check_sha256:
          description: Digest of catalog_check.
          pattern: ^[0-9a-f]{64}$
          title: Catalog Check Sha256
          type: string
        approved_by:
          $ref: '#/components/schemas/PersonRef'
        approved_at:
          format: date-time
          title: Approved At
          type: string
        acknowledged_warnings:
          items:
            $ref: '#/components/schemas/AcknowledgedWarning'
          title: Acknowledged Warnings
          type: array
        status:
          enum:
          - active
          - revoked
          title: Status
          type: string
        revoked_by:
          anyOf:
          - $ref: '#/components/schemas/PersonRef'
          - type: 'null'
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        revocation_reason:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          title: Revocation Reason
      required:
      - approval_id
      - request_id
      - approved_version
      - content_sha256
      - catalog_check
      - catalog_check_sha256
      - approved_by
      - approved_at
      - acknowledged_warnings
      - status
      - revoked_by
      - revoked_at
      - revocation_reason
      title: ApprovalRecord
      type: object
    ApproveInternal:
      additionalProperties: false
      properties:
        action:
          const: approve_internal
          title: Action
          type: string
        expected_version:
          minimum: 1
          title: Expected Version
          type: integer
        acknowledged_warning_ids:
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 1000
          title: Acknowledged Warning Ids
          type: array
        false_positive_warning_ids:
          description: Heuristic warnings the employee judged wrong. Recorded for evaluation.
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 1000
          title: False Positive Warning Ids
          type: array
        note:
          anyOf:
          - maxLength: 2000
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - action
      - expected_version
      - acknowledged_warning_ids
      title: ApproveInternal
      type: object
    ApprovedLineCheck:
      additionalProperties: false
      allOf:
      - properties:
          sku:
            properties:
              active:
                const: true
          unit_check:
            properties:
              status:
                const: same_unit
      description: Catalog facts read for one line at the moment of approval.
      properties:
        line_id:
          format: uuid
          title: Line Id
          type: string
        sku:
          $ref: '#/components/schemas/SkuSnapshot'
          description: Catalog values read at approval, not at selection.
        attribute_evidence:
          items:
            $ref: '#/components/schemas/AttributeEvidence'
          title: Attribute Evidence
          type: array
        unit_check:
          $ref: '#/components/schemas/UnitCheck'
        sku_changed_since_selection:
          title: Sku Changed Since Selection
          type: boolean
      required:
      - line_id
      - sku
      - attribute_evidence
      - unit_check
      - sku_changed_since_selection
      title: ApprovedLineCheck
      type: object
    AttachmentMetadata:
      additionalProperties: false
      description: 'Derived by the server from the preserved bytes. v0.1 does not parse, extract

        or download individual attachments; they exist only inside the complete original.'
      properties:
        part_id:
          maxLength: 100
          pattern: ^[0-9]+(\.[0-9]+)*$
          title: Part Id
          type: string
        filename:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Filename
        media_type:
          maxLength: 200
          minLength: 1
          title: Media Type
          type: string
        size_bytes:
          minimum: 0
          title: Size Bytes
          type: integer
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        disposition:
          anyOf:
          - enum:
            - attachment
            - inline
            type: string
          - type: 'null'
          title: Disposition
        content_id:
          anyOf:
          - maxLength: 998
            type: string
          - type: 'null'
          title: Content Id
        processing:
          const: not_processed
          title: Processing
          type: string
      required:
      - part_id
      - filename
      - media_type
      - size_bytes
      - sha256
      - disposition
      - content_id
      - processing
      title: AttachmentMetadata
      type: object
    AttentionFlag:
      enum:
      - processing_failed
      - conflicting_redelivery
      - possible_duplicate
      - newer_related_message
      - possible_follow_up
      - uncertain_classification
      - unprocessed_attachment
      title: AttentionFlag
      type: string
    AttributeEvidence:
      additionalProperties: false
      properties:
        attribute:
          enum:
          - product
          - dimensions
          - species
          - grade
          - treatment
          title: Attribute
          type: string
        request_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Value
        sku_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Sku Value
        outcome:
          $ref: '#/components/schemas/MatchOutcome'
        synonym_rule_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Synonym Rule Id
      required:
      - attribute
      - request_value
      - sku_value
      - outcome
      - synonym_rule_id
      title: AttributeEvidence
      type: object
    BlockerCode:
      enum:
      - no_active_lines
      - ambiguous_field
      - quantity_unresolved
      - unit_unresolved
      - sku_not_selected
      - sku_inactive
      - unit_incompatible
      - warning_not_acknowledged
      title: BlockerCode
      type: string
    CatalogCandidate:
      additionalProperties: false
      properties:
