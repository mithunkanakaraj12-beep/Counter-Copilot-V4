  /api/v1/inbound/events:
    post:
      operationId: ingestEmailEvent
      summary: Preserve and queue one inbound email
      description: '202: newly preserved. 200: identical redelivery. 409: same external_message_id with
        different content; the new bytes are quarantined. The yard comes from the credential. A success
        response is sent only after the original and the processing job are durable.'
      security:
      - integrationToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              - original
              properties:
                metadata:
                  $ref: '#/components/schemas/InboundEmailEvent'
                original:
                  type: string
                  contentMediaType: message/rfc822
            encoding:
              metadata:
                contentType: application/json
              original:
                contentType: message/rfc822
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAccepted'
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAccepted'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with current state, version or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
