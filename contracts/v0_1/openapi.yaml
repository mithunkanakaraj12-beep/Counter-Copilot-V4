  /api/v1/yards/{yard_id}/communications/{communication_id}/original:
    get:
      operationId: downloadOriginal
      summary: Download the complete preserved original
      description: Streamed through this yard-authorized route only; there is no public or reusable file
        link. Always an attachment download. Audited. v0.1 has no individual attachment download, extraction
        or per-part processing. Attachments are listed as metadata and exist only inside the complete
        original email.
      security:
      - employeeSession: []
      x-required-permission: communication:read_original
      parameters:
      - name: yard_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: communication_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Original bytes
          headers:
            Content-Disposition:
              description: attachment with a server-chosen filename, never the sender's
              required: true
              schema:
                type: string
                pattern: ^attachment; filename=
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
