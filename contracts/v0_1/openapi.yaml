          maxItems: 20
          title: Evidence
          type: array
        related_communication_ids:
          items:
            format: uuid
            type: string
          title: Related Communication Ids
          type: array
      required:
      - warning_id
      - code
      - message
      - target
      - requires_acknowledgement
      - heuristic
      - evidence
      - related_communication_ids
      title: ReviewWarning
      type: object
