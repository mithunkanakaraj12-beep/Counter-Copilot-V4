    ReviewWarning:
      additionalProperties: false
      allOf:
      - if:
          properties:
            code:
              enum:
              - possible_follow_up_same_sender
              - html_derived_text
          required:
          - code
        then:
          properties:
            requires_acknowledgement:
              const: false
      - if:
          properties:
            code:
              enum:
              - unprocessed_attachment
              - possible_duplicate
              - conflicting_redelivery
              - possible_follow_up
              - newer_related_message
              - uncertain_classification
              - selected_sku_attribute_mismatch
              - selected_sku_attribute_unverified
              - selected_sku_changed
              - possible_correction_language
              - uncited_quantity_text
              - evidence_in_quoted_text
              - overlapping_line_evidence
              - model_line_removed
              - multiple_jobs_detected
          required:
          - code
        then:
          properties:
            requires_acknowledgement:
              const: true
      - if:
          properties:
            code:
              enum:
              - possible_correction_language
              - uncited_quantity_text
              - evidence_in_quoted_text
          required:
          - code
        then:
          properties:
            heuristic:
              const: true
      - if:
          properties:
            code:
              enum:
              - unprocessed_attachment
              - possible_duplicate
              - conflicting_redelivery
              - possible_follow_up
              - newer_related_message
              - possible_follow_up_same_sender
              - uncertain_classification
              - selected_sku_attribute_mismatch
              - selected_sku_attribute_unverified
              - selected_sku_changed
              - overlapping_line_evidence
              - model_line_removed
              - multiple_jobs_detected
              - html_derived_text
          required:
          - code
        then:
          properties:
            heuristic:
              const: false
      - if:
          properties:
            code:
              enum:
              - possible_follow_up_same_sender
          required:
          - code
        then:
          properties:
            related_communication_ids:
              maxItems: 0
      - if:
          properties:
            code:
              enum:
              - unprocessed_attachment
          required:
          - code
        then:
          properties:
            target:
              properties:
                scope:
                  const: request
      description: Computed from current facts. warning_id changes if the condition changes.
      properties:
        warning_id:
          maxLength: 500
          minLength: 1
          title: Warning Id
          type: string
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
