openapi: 3.1.0
info:
  title: Counter Copilot V4 API (PROPOSAL)
  version: 0.1.0-proposal.2
  description: 'Contract for the email-to-reviewed-draft slice, revised for independent review. Not frozen
    and not implemented. Behavioural rules are in docs/DATA_CONTRACT.md. v0.1 has no individual attachment
    download, extraction or per-part processing. Attachments are listed as metadata and exist only inside
    the complete original email. Generated by generate_openapi.py: do not edit by hand.'
  x-limits:
    raw_email_bytes: 25000000
    body_chars: 200000
    email_body_lines: 500
    material_lines: 500
    attachments: 100
    mime_parts: 200
    mime_depth: 20
    header_bytes: 256000
    parse_seconds: 30
    json_bytes: 1000000
    evidence_items: 20
    candidates: 10
    operations: 200
    idempotency_hours: 24
    preview_chars: 200
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health without sensitive details
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Temporarily unavailable; safe to retry with the same Idempotency-Key
          x-error-codes:
          - temporarily_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inbound/events:
    post:
      operationId: ingestEmailEvent
      summary: Preserve and queue one inbound email
      description: '202: newly preserved, including mail that cannot be parsed (processing_state failed_terminal).
        200: identical redelivery. 409 conflicting_redelivery: same external_message_id with different
        content; the new bytes are quarantined and the first original is unchanged. 422: forbidden metadata
        keys, original_hash_mismatch or no configured mailbox among envelope_recipients; the submission
        is quarantined and audited. 413: over any parser limit; the application stores nothing, and the
        adapter keeps the source and alerts an operator. The yard comes from the credential. A success
        response is sent only after the original, record and processing job are durable.'
      security:
      - integrationToken: []
      x-max-body-bytes: 26000000
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              - original
              properties:
                metadata:
                  $ref: '#/components/schemas/InboundEmailEvent'
                original:
                  type: string
                  contentMediaType: message/rfc822
                  description: Raw bytes, authoritative.
                  x-max-bytes: 25000000
            encoding:
              metadata:
                contentType: application/json
              original:
                contentType: message/rfc822
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAccepted'
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundAccepted'
        '401':
          description: Missing or invalid credentials
          x-error-codes:
          - unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicts with current state, version, idempotency key or an earlier delivery
          x-error-codes:
          - idempotency_conflict
          - idempotency_in_progress
          - version_conflict
          - invalid_state
          - request_already_exists
          - conflicting_redelivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Over an approved size or parser limit
          x-error-codes:
          - payload_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type
          x-error-codes:
          - unsupported_media_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed, approval blocked or original hash mismatch
          x-error-codes:
          - validation_failed
          - approval_blocked
          - original_hash_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited; retry after the stated delay
          x-error-codes:
          - rate_limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable; safe to retry with the same Idempotency-Key
          x-error-codes:
          - temporarily_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
