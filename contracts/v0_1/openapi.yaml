          type: array
        cleared_by:
          $ref: '#/components/schemas/PersonRef'
        cleared_at:
          format: date-time
          title: Cleared At
          type: string
        proposal:
          anyOf:
          - $ref: '#/components/schemas/DimensionsProposalRecord'
          - type: 'null'
      required:
      - state
