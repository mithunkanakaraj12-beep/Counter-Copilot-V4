components:
  securitySchemes:
    employeeSession:
      type: apiKey
      in: cookie
      name: cc_session
      description: Proposed (U-01). Secure, HttpOnly, SameSite cookie.
    integrationToken:
      type: http
      scheme: bearer
      description: Proposed (U-02). Bound to one yard, integration and channel.
  schemas:
    Actor:
      additionalProperties: false
      properties:
        type:
          enum:
          - system
          - employee
          title: Type
          type: string
        user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: User Id
      required:
      - type
      - user_id
      title: Actor
      type: object
    AddLine:
      additionalProperties: false
      properties:
        op:
          const: add_line
          title: Op
          type: string
        line:
          $ref: '#/components/schemas/NewLine'
      required:
      - op
      - line
      title: AddLine
      type: object
    AmbiguityReason:
      enum:
      - conflicting_statements
      - multiple_interpretations
      - range_given
      - unrecognized_term
      - unclear_reference
      - unreadable
      title: AmbiguityReason
      type: string
    ApprovalBlocker:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/BlockerCode'
        message:
          maxLength: 500
          minLength: 1
          title: Message
          type: string
        line_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Line Id
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
        warning_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warning Id
      required:
      - code
      - message
      - line_id
      - field
      - warning_id
      title: ApprovalBlocker
      type: object
    ApprovalRecord:
      additionalProperties: false
      description: Internal approval of one reviewed version. It authorizes nothing external.
      properties:
        approval_id:
          format: uuid
          title: Approval Id
          type: string
        request_id:
          format: uuid
          title: Request Id
          type: string
        approved_version:
          minimum: 1
          title: Approved Version
          type: integer
        content_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Content Sha256
          type: string
        approved_by:
          format: uuid
          title: Approved By
          type: string
        approved_at:
          format: date-time
          title: Approved At
          type: string
        acknowledged_warning_ids:
          items:
            type: string
          title: Acknowledged Warning Ids
          type: array
        status:
          enum:
          - active
          - revoked
          title: Status
          type: string
        revoked_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Revoked By
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
      required:
      - approval_id
      - request_id
      - approved_version
      - content_sha256
      - approved_by
      - approved_at
      - acknowledged_warning_ids
      - status
      - revoked_by
      - revoked_at
      title: ApprovalRecord
      type: object
    ApproveInternal:
      additionalProperties: false
      properties:
        action:
          const: approve_internal
          title: Action
          type: string
        expected_version:
          minimum: 1
          title: Expected Version
          type: integer
        acknowledged_warning_ids:
          items:
            type: string
          maxItems: 500
          title: Acknowledged Warning Ids
          type: array
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - action
      - expected_version
      - acknowledged_warning_ids
      title: ApproveInternal
      type: object
    AttachmentMetadata:
      additionalProperties: false
      description: Adapter-reported. The bytes remain inside the preserved original message.
      properties:
        filename:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Filename
        media_type:
          maxLength: 200
          minLength: 1
          title: Media Type
          type: string
        size_bytes:
          minimum: 0
          title: Size Bytes
          type: integer
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
      required:
      - filename
      - media_type
      - size_bytes
      - sha256
      title: AttachmentMetadata
      type: object
    AttributeEvidence:
      additionalProperties: false
      properties:
        attribute:
          enum:
          - product
          - thickness
          - width
          - length
          - species
          - grade
          - treatment
          title: Attribute
          type: string
        request_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Value
        sku_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Sku Value
        outcome:
          enum:
          - exact_match
          - synonym_match
          - mismatch
          - not_resolved_in_request
          - not_defined_on_sku
          title: Outcome
          type: string
        synonym_rule_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Synonym Rule Id
      required:
      - attribute
      - request_value
      - sku_value
      - outcome
      - synonym_rule_id
      title: AttributeEvidence
      type: object
    BlockerCode:
      enum:
      - no_active_lines
      - ambiguous_field
