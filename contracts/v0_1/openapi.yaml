  /api/v1/yards/{yard_id}/inbox:
    get:
      operationId: listInbox
      summary: Communications for one yard, newest first
      description: Ordered by ingested_at, then communication_id, both descending. Request summaries are
        null without request:read. A cursor used with another yard or other filters is 422.
      security:
      - employeeSession: []
      x-required-permission: communication:read
      x-conditional-permissions:
        request summaries, review_state and has_draft filters: request:read
      parameters:
      - name: yard_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque. Bound to the yard and the filters.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - needs_review
          - all
          default: needs_review
        description: 'needs_review: handling is open, and the item is not an approved or declined request
          without attention flags.'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: Case-insensitive substring of sender or subject. Not the body.
      - name: sender
        in: query
        required: false
        schema:
          type: string
          maxLength: 320
        description: Exact sender address.
      - name: received_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: received_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: review_state
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft_ready
          - internally_approved
          - declined
        description: Needs request:read.
      - name: processing_state
        in: query
        required: false
        schema:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed_retryable
          - failed_terminal
      - name: classification
        in: query
        required: false
        schema:
          type: string
          enum:
          - material_request
          - follow_up
          - non_request
          - uncertain
      - name: handling
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - handled
      - name: has_attachments
        in: query
        required: false
        schema:
          type: boolean
      - name: has_draft
        in: query
        required: false
        schema:
          type: boolean
        description: Needs request:read.
      - name: attention
        in: query
        required: false
        schema:
          type: boolean
        description: Only items with, or without, attention flags.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '401':
          description: Missing or invalid credentials
          x-error-codes:
          - unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but lacking permission, or failed CSRF check
          x-error-codes:
          - forbidden
          - csrf_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, including resources belonging to another yard
          x-error-codes:
          - not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed, approval blocked or original hash mismatch
          x-error-codes:
          - validation_failed
          - approval_blocked
          - original_hash_mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited; retry after the stated delay
          x-error-codes:
          - rate_limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
