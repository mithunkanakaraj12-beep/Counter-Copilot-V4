      - board_foot
      - bundle
      - box
      - bag
      - roll
      - pallet
      title: UnitCode
      type: string
    UnitField:
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: extracted
          required:
          - state
        then:
          properties:
            value:
              not:
                type: 'null'
            candidates:
              maxItems: 0
            ambiguity_reason:
              type: 'null'
            evidence:
              contains:
                properties:
                  role:
                    const: supports
              minItems: 1
            entered_by:
              type: 'null'
            entered_at:
              type: 'null'
      - if:
          properties:
            state:
              const: missing
          required:
          - state
        then:
          properties:
            value:
              type: 'null'
            candidates:
              maxItems: 0
            ambiguity_reason:
              type: 'null'
            evidence:
              maxItems: 0
            entered_by:
              type: 'null'
            entered_at:
              type: 'null'
      - if:
          properties:
            state:
              const: ambiguous
          required:
          - state
        then:
          properties:
            value:
              type: 'null'
            ambiguity_reason:
              not:
                type: 'null'
            evidence:
              minItems: 1
            entered_by:
              type: 'null'
            entered_at:
              type: 'null'
      - if:
          properties:
            state:
              const: employee_entered
          required:
          - state
        then:
          properties:
            value:
              not:
                type: 'null'
            candidates:
              maxItems: 0
            ambiguity_reason:
              type: 'null'
            evidence:
              maxItems: 0
            entered_by:
              not:
                type: 'null'
            entered_at:
              not:
                type: 'null'
      properties:
        state:
          $ref: '#/components/schemas/FieldState'
        value:
          anyOf:
          - $ref: '#/components/schemas/UnitCode'
          - type: 'null'
        candidates:
          items:
            $ref: '#/components/schemas/UnitCode'
          title: Candidates
          type: array
        ambiguity_reason:
          anyOf:
          - $ref: '#/components/schemas/AmbiguityReason'
          - type: 'null'
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          title: Evidence
          type: array
        entered_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Entered By
        entered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Entered At
      required:
      - state
      - value
      - candidates
      - ambiguity_reason
      - evidence
      - entered_by
      - entered_at
      title: UnitField
      type: object
    WarningCode:
      enum:
      - unprocessed_attachment
      - possible_duplicate
      - possible_follow_up
      - conflicting_delivery
      - uncertain_classification
      - selected_sku_attribute_mismatch
      title: WarningCode
      type: string
    YardMembership:
      additionalProperties: false
      properties:
        yard_id:
          format: uuid
          title: Yard Id
          type: string
        yard_name:
          title: Yard Name
          type: string
        timezone:
          title: Timezone
          type: string
        permissions:
          items:
            $ref: '#/components/schemas/Permission'
          title: Permissions
          type: array
      required:
      - yard_id
      - yard_name
      - timezone
      - permissions
      title: YardMembership
      type: object
