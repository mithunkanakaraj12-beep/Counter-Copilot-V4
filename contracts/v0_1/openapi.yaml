      type: object
    CommunicationRecord:
      additionalProperties: false
      allOf:
      - else:
          properties:
            sender:
              not:
                type: 'null'
            recipients:
              not:
                type: 'null'
            body_text:
              not:
                type: 'null'
            body_source:
              not:
                type: 'null'
            thread:
              not:
                type: 'null'
            attachments:
              not:
                type: 'null'
            quoted_spans:
              not:
                type: 'null'
        if:
          properties:
            parse_status:
              const: failed
          required:
          - parse_status
        then:
          properties:
            sender:
              type: 'null'
            recipients:
              type: 'null'
            subject:
              type: 'null'
            body_text:
              type: 'null'
            body_source:
              type: 'null'
            thread:
              type: 'null'
            attachments:
              type: 'null'
            quoted_spans:
              type: 'null'
      description: Immutable once written. No API updates or deletes it.
      properties:
        parser_version:
          maxLength: 500
          minLength: 1
          title: Parser Version
          type: string
        parse_status:
          enum:
          - parsed
          - failed
          title: Parse Status
          type: string
        sender:
          anyOf:
          - $ref: '#/components/schemas/EmailParty'
          - type: 'null'
        recipients:
          anyOf:
          - items:
              $ref: '#/components/schemas/EmailParty'
            maxItems: 1000
            type: array
          - type: 'null'
          description: To and Cc header addresses.
          title: Recipients
        subject:
          anyOf:
          - maxLength: 256000
            type: string
          - type: 'null'
          title: Subject
        body_text:
          anyOf:
          - maxLength: 200000
            not:
              pattern: ^(?:[^\n]*\n){500}[\s\S]
            type: string
          - type: 'null'
          description: Decoded text with CRLF changed to LF and nothing else. Untrusted.
          title: Body Text
        body_source:
          anyOf:
          - enum:
            - text_plain
            - text_html_derived
            - none
            type: string
          - type: 'null'
          title: Body Source
        thread:
          anyOf:
          - $ref: '#/components/schemas/EmailThread'
          - type: 'null'
        attachments:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttachmentMetadata'
            maxItems: 100
            type: array
          - type: 'null'
          title: Attachments
        quoted_spans:
          anyOf:
          - items:
              $ref: '#/components/schemas/TextSpan'
            type: array
          - type: 'null'
          description: Ranges of body_text recognised as quoted or forwarded history.
          title: Quoted Spans
        communication_id:
          format: uuid
          title: Communication Id
          type: string
        yard_id:
          format: uuid
          title: Yard Id
          type: string
        integration_id:
          format: uuid
          title: Integration Id
          type: string
        channel:
          const: email
          title: Channel
          type: string
        direction:
          const: inbound
          title: Direction
          type: string
        external_message_id:
          maxLength: 512
          minLength: 1
          title: External Message Id
          type: string
        provider_thread_id:
          anyOf:
          - maxLength: 512
            minLength: 1
            type: string
          - type: 'null'
          title: Provider Thread Id
        content_fingerprint:
          pattern: ^[0-9a-f]{64}$
          title: Content Fingerprint
          type: string
        received_at:
          format: date-time
          title: Received At
          type: string
        ingested_at:
          format: date-time
          title: Ingested At
          type: string
        envelope_recipients:
          items:
            maxLength: 320
            minLength: 1
            type: string
          maxItems: 200
          minItems: 1
          title: Envelope Recipients
          type: array
        provider_metadata:
          additionalProperties:
            type: string
          title: Provider Metadata
          type: object
        original:
          $ref: '#/components/schemas/OriginalDescriptor'
      required:
      - parser_version
      - parse_status
      - sender
      - recipients
      - subject
      - body_text
      - body_source
      - thread
      - attachments
      - quoted_spans
      - communication_id
      - yard_id
      - integration_id
      - channel
      - direction
      - external_message_id
      - provider_thread_id
      - content_fingerprint
      - received_at
      - ingested_at
      - envelope_recipients
      - provider_metadata
      - original
      title: CommunicationRecord
      type: object
    CommunicationStatus:
