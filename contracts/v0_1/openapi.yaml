          type: string
        value:
          title: Value
          type: 'null'
        candidates:
          items:
            $ref: '#/components/schemas/Dimensions'
          maxItems: 0
          title: Candidates
          type: array
        ambiguity_reason:
          title: Ambiguity Reason
          type: 'null'
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          maxItems: 0
          title: Evidence
          type: array
        proposal:
          anyOf:
          - $ref: '#/components/schemas/DimensionsProposalRecord'
          - type: 'null'
      required:
      - state
      - value
      - candidates
      - ambiguity_reason
      - evidence
      - proposal
      title: DimensionsFieldMissing
      type: object
    DimensionsProposalRecord:
      additionalProperties: false
      allOf:
      - if:
          properties:
            state:
              const: extracted
          required:
          - state
        then:
          properties:
            value:
              not:
                type: 'null'
            candidates:
              maxItems: 0
            ambiguity_reason:
              type: 'null'
            evidence:
              contains:
                properties:
                  role:
                    const: supports
                required:
                - role
              minItems: 1
      - if:
          properties:
            state:
              const: missing
          required:
          - state
        then:
          properties:
            value:
              type: 'null'
            candidates:
              maxItems: 0
            ambiguity_reason:
              type: 'null'
            evidence:
              maxItems: 0
      - if:
          properties:
            state:
              const: ambiguous
          required:
          - state
        then:
          properties:
            value:
              type: 'null'
            ambiguity_reason:
              not:
                type: 'null'
            evidence:
              minItems: 1
      properties:
        state:
          enum:
          - extracted
          - missing
          - ambiguous
          title: State
          type: string
        value:
          anyOf:
          - $ref: '#/components/schemas/Dimensions'
          - type: 'null'
        candidates:
          items:
