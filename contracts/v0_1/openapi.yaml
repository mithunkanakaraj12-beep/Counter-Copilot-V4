        value:
          $ref: '#/components/schemas/Dimensions'
        candidates:
          items:
            $ref: '#/components/schemas/Dimensions'
          maxItems: 0
          title: Candidates
          type: array
        ambiguity_reason:
          title: Ambiguity Reason
          type: 'null'
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          maxItems: 20
          title: Evidence
          type: array
        entered_by:
          $ref: '#/components/schemas/PersonRef'
        entered_at:
